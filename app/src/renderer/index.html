<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' mcl: https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' mcl:">
  <title>McLauncher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="titlebar">
    <div class="drag"></div>
    <div class="win-buttons">
      <button data-win="min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="max" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
      <button data-win="close" class="close" title="Close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </div>
  <div id="app">
    <nav id="sidebar">
      <div class="brand"><canvas id="brand-mark" width="8" height="8"></canvas><span>McLauncher</span></div>
      <div class="nav">
        <a href="#library" data-nav="library"><svg viewBox="0 0 20 20"><path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z"/></svg>Library</a>
        <a href="#discover" data-nav="discover"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>Discover</a>
      </div>
      <div class="side-heading">Instances</div>
      <div id="side-instances"></div>
      <div class="side-bottom">
        <button id="account-chip" class="account-chip"></button>
        <a href="#settings" data-nav="settings" class="icon-link" title="Settings" aria-label="Settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg></a>
      </div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="tasks" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="js/util.js"></script>
  <script src="js/components.js"></script>
  <script src="js/library.js"></script>
  <script src="js/instance.js"></script>
  <script src="js/discover.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
