name: Test & build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    env:
      MCL_DATA_DIR: ${{ github.workspace }}/ci-data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: System packages for headless Electron + Minecraft
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libgbm1 libnss3 libasound2t64 libxss1 libxtst6 libgtk-3-0t64 xauth x11-xserver-utils
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Online checks (Mojang, Fabric, Modrinth, CurseForge)
        run: |
          mkdir -p ../ci-out
          set -o pipefail
          timeout 2400 node test/online.js 2>&1 | tee ../ci-out/online.txt
      - name: Publish early output
        if: always() && github.event_name != 'pull_request'
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cp -r ../ci-out/. /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b ci-logs && git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "CI output (online) ${GITHUB_SHA}" --allow-empty
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs
      - name: Launch newest Minecraft + Fabric through the launcher
        timeout-minutes: 12
        if: always()
        env:
          MCL_TEST_OFFLINE: CiPlayer
          MCL_TEST_LAUNCH: ci-newest
          MCL_TEST_EXIT_AFTER_READY: '1'
          MCL_TEST_RESULT: ${{ github.workspace }}/launch-newest.json
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout -k 15 600 xvfb-run -a -s "-screen 0 1600x1000x24 +extension GLX +render -noreset" npx electron . --no-sandbox > "$MCL_TEST_RESULT.out" 2>&1 || true
          tail -50 "$MCL_TEST_RESULT.out"; cp "$MCL_TEST_RESULT.out" ../ci-out/ 2>/dev/null || true
          cat "$MCL_TEST_RESULT"
          node -e "const r=require(process.env.MCL_TEST_RESULT); if(!r.started){console.error('game did not start');process.exit(1)} if(!r.reachedRunning) console.log('::warning::newest Minecraft started but could not open a window on the CI display')"
      - name: Launch 1.21.1 with Sodium + Iris
        timeout-minutes: 12
        if: always()
        env:
          MCL_TEST_OFFLINE: CiPlayer
          MCL_TEST_LAUNCH: ci-1-21-1
          MCL_TEST_EXIT_AFTER_READY: '1'
          MCL_TEST_RESULT: ${{ github.workspace }}/launch-1211.json
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout -k 15 600 xvfb-run -a -s "-screen 0 1600x1000x24 +extension GLX +render -noreset" npx electron . --no-sandbox > "$MCL_TEST_RESULT.out" 2>&1 || true
          tail -50 "$MCL_TEST_RESULT.out"; cp "$MCL_TEST_RESULT.out" ../ci-out/ 2>/dev/null || true
          cat "$MCL_TEST_RESULT"
          node -e "const r=require(process.env.MCL_TEST_RESULT); if(!r.reachedRunning||!r.hidden){console.error('game did not reach the running state or launcher did not close');process.exit(1)}"
      - name: Launch NeoForge 1.21.1, Forge 1.20.1 and Forge 1.12.2
        if: always()
        timeout-minutes: 30
        env:
          MCL_TEST_OFFLINE: CiPlayer
          MCL_TEST_EXIT_AFTER_READY: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          fail=0
          for id in ci-neoforge ci-forge ci-forge-legacy; do
            export MCL_TEST_LAUNCH=$id MCL_TEST_RESULT="$GITHUB_WORKSPACE/launch-$id.json"
            timeout -k 15 540 xvfb-run -a -s "-screen 0 1600x1000x24 +extension GLX +render -noreset" npx electron . --no-sandbox > "../ci-out/launch-$id.out" 2>&1 || true
            node -e "const r=require(process.env.MCL_TEST_RESULT); console.log(process.env.MCL_TEST_LAUNCH, {code:r.code, started:r.started, reached:r.reachedRunning, hidden:r.hidden, error:r.error}); if(!r.reachedRunning||!r.hidden) process.exit(1)" || fail=1
          done
          exit $fail
      - name: UI screenshots
        timeout-minutes: 6
        if: always()
        env:
          MCL_TEST_SHOTS: ${{ github.workspace }}/shots
          MCL_TEST_SHOT_INST: ci-1-21-1
        run: timeout -k 15 240 xvfb-run -a -s "-screen 0 1600x1000x24 +extension GLX +render -noreset" npx electron . --no-sandbox || true
      - name: Collect logs
        if: always()
        run: |
          mkdir -p ../ci-out
          cp -r "$MCL_DATA_DIR/logs" ../ci-out/launcher-logs 2>/dev/null || true
          cp "$MCL_DATA_DIR/online-results.json" ../ci-out/ 2>/dev/null || true
          cp ../launch-*.json ../ci-out/ 2>/dev/null || true
          cp -r ../shots ../ci-out/ 2>/dev/null || true
          find "$MCL_DATA_DIR/instances" -path '*crash-reports*' -name '*.txt' -exec cp {} ../ci-out/ \; 2>/dev/null || true
      - name: Publish test output to the ci-logs branch
        if: always() && github.event_name != 'pull_request'
        run: |
          cd ../ci-out
          git init -q -b ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI output ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-output
          path: ci-out

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Packaging tools (bsdtar for pacman packages)
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - run: npm ci
      - name: Build Linux packages
        run: npx electron-builder --linux pacman AppImage tar.gz --x64 --publish never
      - name: List output
        run: ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            app/dist/*.pacman
            app/dist/*.AppImage
            app/dist/*.tar.gz

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      MCL_DATA_DIR: ${{ github.workspace }}\ci-data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Online checks (Mojang, Fabric, Modrinth, CurseForge)
        run: |
          mkdir -p ../ci-out
          set -o pipefail
          timeout 2400 node test/online.js 2>&1 | tee ../ci-out/online.txt
      - name: Software OpenGL for the runner (Mesa llvmpipe next to javaw.exe)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/pal1000/mesa-dist-win/releases/latest --jq '.assets[] | select(.name | test("release-msvc\\.7z$")) | .browser_download_url' | head -1)
          echo "Mesa: $url"
          curl -sL "$url" -o /tmp/mesa.7z && 7z x -y -o/tmp/mesa /tmp/mesa.7z > /dev/null
          DATA=$(cygpath -u "$MCL_DATA_DIR")
          for bin in "$DATA"/runtime/*/bin; do cp /tmp/mesa/x64/*.dll "$bin"/ && echo "copied into $bin"; done
      - name: Launch 1.21.1 with Sodium + Iris
        if: always()
        timeout-minutes: 12
        env:
          MCL_TEST_OFFLINE: CiPlayer
          MCL_TEST_LAUNCH: ci-1-21-1
          MCL_TEST_EXIT_AFTER_READY: '1'
          MCL_TEST_RESULT: ${{ github.workspace }}\launch-win-1211.json
          GALLIUM_DRIVER: llvmpipe
        run: |
          timeout -k 15 600 npx electron . > ../ci-out/launch-win-1211.out 2>&1 || true
          cat "$MCL_TEST_RESULT"
          node -e "const r=require(process.env.MCL_TEST_RESULT); if(!r.started){console.error('game did not start');process.exit(1)} if(!r.reachedRunning||!r.hidden) console.log('::warning::game started but did not reach the title screen on the runner')"
      - name: Launch NeoForge 1.21.1
        if: always()
        timeout-minutes: 14
        env:
          MCL_TEST_OFFLINE: CiPlayer
          MCL_TEST_LAUNCH: ci-neoforge
          MCL_TEST_EXIT_AFTER_READY: '1'
          MCL_TEST_RESULT: ${{ github.workspace }}\launch-win-neoforge.json
          GALLIUM_DRIVER: llvmpipe
        run: |
          timeout -k 15 700 npx electron . > ../ci-out/launch-win-neoforge.out 2>&1 || true
          node -e "const r=require(process.env.MCL_TEST_RESULT); console.log({code:r.code, started:r.started, reached:r.reachedRunning, hidden:r.hidden, error:r.error}); if(!r.started) process.exit(1); if(!r.reachedRunning) console.log('::warning::NeoForge started but did not reach the title screen on the runner')"
      - name: UI screenshots
        if: always()
        timeout-minutes: 6
        env:
          MCL_TEST_SHOTS: ${{ github.workspace }}\shots
          MCL_TEST_SHOT_INST: ci-1-21-1
        run: timeout -k 15 240 npx electron . || true
      - name: Publish test output to the ci-logs-win branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p ../ci-out
          DATA=$(cygpath -u "$MCL_DATA_DIR")
          cp -r "$DATA/logs" ../ci-out/launcher-logs 2>/dev/null || true
          cp ../launch-*.json ../ci-out/ 2>/dev/null || true
          cp -r ../shots ../ci-out/ 2>/dev/null || true
          cd ../ci-out
          git init -q -b ci-logs-win
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Windows CI output ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs-win

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build Windows installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never
      - run: ls -la dist
      - uses: actions/upload-artifact@v5
        with:
          name: windows-packages
          path: |
            app/dist/*-setup.exe
            app/dist/*-portable.exe

  release:
    # Releases are cut from main: when app/package.json has a version without a release yet, publish it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build, test-windows, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: linux-packages
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: windows-packages
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          git push -q --delete origin ci-logs ci-logs-win || true
          TAG="v$(node -p "require('./app/package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "McLauncher $TAG" --notes-file RELEASE_NOTES.md
